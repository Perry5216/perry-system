name: perry-system

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_LLM_LIBRARY=cuda_v13
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=24h
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama-embeddings:
    image: ollama/ollama:latest
    container_name: ollama-embeddings
    environment:
      - OLLAMA_LLM_LIBRARY=cuda_v13
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - CUDA_VISIBLE_DEVICES=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    restart: unless-stopped
    volumes:
      - ./data/ollama-embeddings:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  comfyui:
    image: yanwk/comfyui-boot:cu128-slim
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - ./data/comfyui/models:/root/ComfyUI/models
      - ./perry/workspace/comfyui-output:/root/ComfyUI/output
      - ./data/comfyui/custom_nodes:/root/ComfyUI/custom_nodes
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --highvram
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')\" 2>/dev/null && echo ok || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  perry:
    build:
      context: ./perry
      dockerfile: docker/Dockerfile
    container_name: perry
    restart: unless-stopped
    ports:
      - "3847:3847"
    volumes:
      - ./perry/workspace:/app/workspace
      - ./perry/config:/app/config
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LIBRARIAN_BASE_URL=http://ollama-embeddings:11434
      - COMFYUI_BASE_URL=http://comfyui:8188
      - PERRY_VAULT_KEY=${PERRY_VAULT_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=8192
    depends_on:
      ollama:
        condition: service_healthy
      ollama-embeddings:
        condition: service_healthy
      comfyui:
        condition: service_healthy

  perry-trainer:
    build:
      context: ./perry/trainer
      dockerfile: Dockerfile
    container_name: perry-trainer
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/trainer/hf_cache
      - OLLAMA_ENDPOINT=http://ollama:11434
    volumes:
      - ./perry/workspace:/workspace
      - ./data/trainer_cache:/trainer/hf_cache
      - ./data/ollama:/ollama_storage
      - ./perry/config:/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
