version: '3.8'

services:
  perry-trainer:
    build:
      context: ./trainer
      dockerfile: Dockerfile
    container_name: perry-trainer
    restart: unless-stopped
    environment:
      # Target GPU 0 (5090 — Writer GPU, idle between generation passes)
      # GPU 1 (5070 Ti) is the Librarian and is constantly contested by ollama-embeddings
      - CUDA_VISIBLE_DEVICES=0
      # HuggingFace cache inside the container
      - HF_HOME=/trainer/hf_cache
      # Ollama endpoint to register the new model after training (Writer GPU — 5090)
      - OLLAMA_ENDPOINT=http://ollama:11434
    volumes:
      # Shared workspace — reads training_data.jsonl, writes lora-adapter/ and gguf/
      - ./workspace:/workspace
      # Persistent HF model cache (avoids re-downloading Qwen3.6-27B weights)
      - perry_trainer_cache:/trainer/hf_cache
      # Ollama internal storage for direct GGUF injection
      - n8n_ollama_data:/ollama_storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    networks:
      - perry_default

networks:
  perry_default:
    external: true
    name: n8n_n8n-net  # Perry's actual docker network

volumes:
  perry_trainer_cache:
  n8n_ollama_data:
    external: true
